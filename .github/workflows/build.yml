name: Build and Release Photo Vault APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for Gradle wrapper
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Build Debug & Release APK with Gradle
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoVault-v2.5.0-Debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "Photo Vault Pro v2.5.0"
          tag_name: v2.5.0
          body: |
            ## 🛡️ خزنة الصور والفيديو Pro Security Edition v2.5.0
            تطوير: Ahmed Becetti
            الموقع والمتجر الرسمي: https://ahmedbecett.github.io/Protection-Tele/
            
            ### المميزات المضمنة:
            - 🔒 فتح بالبصمة الحيوية أو بالوجه (Biometrics)
            - 📱 قفل النمط التفاعلي (شيما)
            - 🔢 رمز PIN السري المشفر
            - 🎭 الخزنة الوهمية (Decoy Safe)
            - 🧮 وضع تمويه الآلة الحاسبة الذكية
            - 🛡️ تشفير محلي عسكري AES-256
            - 📸 مشغل فيديو وعارض صور احترافي مع تقريب
            - 🚨 سجل كشف المتطفلين ومحاولات التسلل
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
